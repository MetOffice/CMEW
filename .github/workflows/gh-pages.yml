name: Build and deploy the documentation

# Controls when the workflow will run.
on:
  # Triggers the workflow on push to main.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Use a login shell so the Conda environment is activated.
defaults:
  run:
    shell: bash -leo pipefail {0}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment,
# skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs
# as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build documentation with Sphinx
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE,
      # so your job can access it.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/workflows/cmew-env/cmew-env.lock
          environment-name: cmew-env
          cache-environment: true
          cache-environment-key: env-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/cmew-env/cmew-env.lock') }}

      - name: Build documentation using Sphinx
        run: make --directory=doc html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/html

  # Deploy built documentation to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
