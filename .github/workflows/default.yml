# This workflow creates the required Conda environment,
# performs various validation steps for Cylc and Rose,
# and builds and checks the documentation.
name: default

# Controls when the workflow will run.
on:
  # Explicitly specifying the types below, just in case the defaults change:
  # https://docs.github.com/en/enterprise-cloud@latest/actions/
  # writing-workflows/choosing-when-your-workflow-runs/
  # events-that-trigger-workflows#pull_request.
  # Triggers the workflow when a pull request is created,
  # and every time changes are pushed to the feature branch
  # after the pull request is created.
  pull_request:
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Use a login shell so the Conda environment is activated.
defaults:
  run:
    shell: bash -leo pipefail {0}

# A workflow run is made up of one or more jobs
# that can run sequentially or in parallel.
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part
    # of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE,
      # so your job can access it.
      - uses: actions/checkout@v6

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/workflows/cmew-env/cmew-env.lock
          environment-name: cmew-env
          cache-environment: true
          cache-environment-key: env-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/cmew-env/cmew-env.lock') }}

      - name: Validate Cylc workflow
        run: |
          cd CMEW
          cylc validate -O metoffice .

      - name: Run Cylc configuration linter
        run: |
          cd CMEW
          cylc lint

      - name: Run all Rose validator macros against Rose configuration files
        run: |
          cd CMEW
          rose macro -V

      - name: Validate format of Rose configuration files
        run: |
          cd CMEW
          output="$(rose config-dump)"
          msg="Run 'rose config-dump' to re-dump the Rose configuration files"
          msg="${msg} in the common format, then commit the changes."
          # The '-z' option returns true if 'output' is empty.
          if [[ -z "${output}" ]]; then exit 0; else echo "${msg}" && exit 1; fi

      - name: Validate Rose configuration metadata
        run: |
          cd CMEW
          rose metadata-check -C meta/

      - name: Build documentation
        run: make --directory=doc html

      - name: Check for broken links in the documentation
        run: make --directory=doc linkcheck

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      # Find all bash scripts (files with an 'sh' extension)
      # and explicitly include the `env` files (which have no extension).
      - name: Run ShellCheck
        run: |
          find . -type f \( -name "*.sh" -or -name "*-env$" \) \
          -exec shellcheck {} \;
