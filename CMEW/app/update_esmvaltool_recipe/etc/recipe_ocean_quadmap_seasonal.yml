    variables:
      tos:
        preprocessor: prep_quad_map_son
        mip: Omon
    additional_datasets:
      - {dataset: WOA, project: OBS6, type: clim, version: 2023,
         start_year: 2000, end_year: 2000, tier: 2}
    scripts:
      Global_Ocean_map:  *Global_Ocean_map

  sea_water_potential_temperature_djf:
    description: Global DJF mean depth quad plots thetao
    variables:
      thetao:
        preprocessor: prep_quad_map_depth_djf
        mip: Omon
    additional_datasets:
      - {dataset: WOA, project: OBS6, type: clim, version: 2023,
         start_year: 2000, end_year: 2000, tier: 2}
    scripts:
