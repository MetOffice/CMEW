#
# Standard recipes are retrieved from ESMValTool.
# The ocean_quadmap_seasonal recipe is maintained privately by CMEW
# while the seasonal changes are being tested.

[command]
default=set -euo pipefail
       =if [ "$CYLC_TASK_PARAM_recipe" = "ocean_quadmap_seasonal" ]; then
       =    cp recipe_ocean_quadmap_seasonal.yml "$RECIPE_PATH"
       =else
       =    cmew-esmvaltool-env esmvaltool recipes get "$RECIPE_NAME"
       =    mv "$RECIPE_NAME" "$RECIPE_PATH"
       =fi
       =cmew-esmvaltool-env update_recipe_file \
       =--recipe_path "$RECIPE_PATH" \
       =--model_runs_yml_fp "${DATASETS_LIST_DIR}/model_runs.yml" \
       =--cmip6_datasets_yml_fp "${DATASETS_LIST_DIR}/cmip6_datasets.yml" \
       =--recipe_id "$CYLC_TASK_PARAM_recipe"
       =cmew-esmvaltool-env get_variables_from_recipe \
       =--recipe_path "$RECIPE_PATH" \
       =--output_filepath "$RECIPE_VARIABLES_PATH"

[file:recipe_ocean_quadmap_seasonal.yml]
source=$CYLC_WORKFLOW_RUN_DIR/app/update_esmvaltool_recipe/etc/recipe_ocean_quadmap_seasonal.yml

[file:$VARIABLES_LIST_DIR]
mode=mkdir

[file:${CYLC_WORKFLOW_SHARE_DIR}/etc]
mode=mkdir
