[command]
default=set -euo pipefail
       =# CDDS has no post-extraction hook, so template the nested workflow,
       =# inject the NEMO time repair, then submit the patched workflow.
       =cmew-standardise-env python ${CYLC_WORKFLOW_RUN_DIR}/app/standardise_model_data/bin/run_cdds_with_time_repair.py \
       =--request-path "${REQUEST_PATH}" \
       =--repair-script ${CYLC_WORKFLOW_RUN_DIR}/app/standardise_model_data/bin/repair_nemo_time_metadata.py
       =save_raw_data.sh
