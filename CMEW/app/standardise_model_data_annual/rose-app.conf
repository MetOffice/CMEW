#
# Opt-in annual "ony" standardisation route, used only for the model runs
# listed in CYLC_TASK_PARAM_annual_dataset (see flow.cylc). This never
# invokes cdds_extract, cdds_convert, or run_mip_convert; it calls
# standardise_ony_annual.py directly. The monthly onm/cdds_convert route
# (standardise_model_data app) is unaffected by this app.

[command]
default=cmew-standardise-env python \
       =${CYLC_WORKFLOW_RUN_DIR}/app/standardise_model_data/bin/standardise_ony_annual.py \
       =--suite-id ${CYLC_TASK_PARAM_annual_dataset} \
       =--start-year ${START_YEAR} \
       =--end-year ${ANNUAL_END_YEAR} \
       =--model-runs-yml-fp ${DATASETS_LIST_DIR}/model_runs.yml \
       =--model-ancillaries-fp ${MODEL_ANCILLARIES_FP} \
       =--recipe-variables-file ${RECIPE_VARIABLES_PATH} \
       =--retrieval-dir ${ROOT_DATA_DIR}/annual_ony/${CYLC_TASK_PARAM_annual_dataset}/ony \
       =--model-output-dir ${ROOT_DATA_DIR}/annual_ony \
       =--output-dir ${ROOT_DATA_DIR}/annual_ony \
       =--cfg-path ${CYLC_WORKFLOW_SHARE_DIR}/etc/mip_convert_annual_${CYLC_TASK_PARAM_annual_dataset}.cfg \
       =--cmor-log-file ${CYLC_WORKFLOW_SHARE_DIR}/etc/cmor_annual_${CYLC_TASK_PARAM_annual_dataset}.log \
       =--datestamp $(date -u +%Y-%m-%dT%H%MZ)
