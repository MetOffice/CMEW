[command]
default=rose env-cat $CYLC_TASK_WORK_DIR/rose-app-run.conf -o $CYLC_TASK_WORK_DIR/template.conf ; \
       =cmew-esmvaltool-env create_html_page \
       = --template $J2_TEMPLATE_FILE \
       = --html-page $OUTPUT_FILE \
       = --data $CYLC_TASK_WORK_DIR/template.conf

[env]
ASSESSMENT_TITLE=$ASSESSMENT_TITLE
DATASETS=$DATASETS
J2_TEMPLATE_FILE=$J2_TEMPLATE_FILE
NUMBER_OF_YEARS=$NUMBER_OF_YEARS
OUTPUT_FILE=$OUTPUT_FILE
START_YEAR=$START_YEAR
