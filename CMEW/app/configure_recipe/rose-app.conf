[command]
default=cmew-esmvaltool-env esmvaltool config copy $ESMVALTOOL_SITE_CONFIG $SITE_CONFIG_INTERIM_PATH
       =cmew-esmvaltool-env esmvaltool config copy defaults/config-user.yml $USER_CONFIG_INTERIM_PATH
       =cmew-esmvaltool-env configure_recipe \
       =--site_config_defaults_filepath $SITE_CONFIG_INTERIM_PATH \
       =--user_config_defaults_filepath $USER_CONFIG_INTERIM_PATH \
       =--site_local_data_key $ESMVALTOOL_SITE_DATA_KEY \
       =--cmew_data_for_esmval_dir $CMEW_DATA_FOR_ESMVAL_DIR \
       =--max_parallel_tasks $MAX_PARALLEL_TASKS \
       =--output_dir $OUTPUT_DIR \
       =--site_config_output_path $SITE_CONFIG_PATH \
       =--user_config_output_path $USER_CONFIG_PATH

[env]
SITE_CONFIG_INTERIM_PATH=${CYLC_TASK_WORK_DIR}/${ESMVALTOOL_SITE_CONFIG}
USER_CONFIG_INTERIM_PATH=${CYLC_TASK_WORK_DIR}/config-user.yml
