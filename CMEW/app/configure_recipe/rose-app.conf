[command]
default=cmew-esmvaltool-env esmvaltool config copy $ESMVALTOOL_SITE_CONFIG ${CYLC_TASK_WORK_DIR}/${ESMVALTOOL_SITE_CONFIG}
       =cmew-esmvaltool-env esmvaltool config get_config_user --path ${CYLC_TASK_WORK_DIR}/config-user.yml
       =cmew-esmvaltool-env configure_recipe \
       =--site_config_defaults_filepath ${CYLC_TASK_WORK_DIR}/${ESMVALTOOL_SITE_CONFIG} \
       =--user_config_defaults_filepath ${CYLC_TASK_WORK_DIR}/config-user.yml \
       =--cmew_data_for_esmval_dir $CMEW_DATA_FOR_ESMVAL_DIR \
       =--max_parallel_tasks $MAX_PARALLEL_TASKS \
       =--output_dir $OUTPUT_DIR \
       =--site_config_output_path $SITE_CONFIG_PATH \
       =--user_config_output_path $USER_CONFIG_PATH
