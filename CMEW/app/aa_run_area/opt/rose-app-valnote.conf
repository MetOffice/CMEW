[command]
default=cmew-esmvaltool-env aa_mksource              \
       = --nyears $NUMBER_OF_YEARS                   \
       = --startyear $START_YEAR                     \
       = --exper-name "$SUITE_TITLE"                 \
       = --control-name "$REF_SUITE_TITLE"           \
       = --mean-root $AUTOASSESS_DATA_DIR            \
       = $SUITE_ID $REF_SUITE_ID ;                   \
       =cmew-esmvaltool-env aa_valnote               \
       = --title "$ASSESSMENT_TITLE"                 \
       = --out-dir $ASSESSMENT_OUTPUT_DIR/valnote    \
       = --obs-dir $OBS_CLIM_PATH                    \
       = --ancil-dir $ANCIL_PATH                     \
       = --tmp-dir $CYLC_TASK_WORK_DIR               \
       = --steps='MRV'
