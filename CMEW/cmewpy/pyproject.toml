[project]
name = "cmewpy"
dynamic = ["version"]

[project.scripts]
add_datasets_to_share = "cmewpy.centralise_evaluation_metadata.command_line:main_for_add_datasets_to_share"
create_esmvaltool_config = "cmewpy.create_esmvaltool_config.command_line:main_for_create_esmvaltool_config"
create_request_file = "cmewpy.create_cdds_config.command_line:main_for_create_request_file"
create_variables_file = "cmewpy.create_cdds_config.command_line:main_for_create_variables_file"
get_variables_from_recipe = "cmewpy.update_esmvaltool_recipe.command_line:main_for_get_variables_from_recipe"
update_recipe_file = "cmewpy.update_esmvaltool_recipe.command_line:main_for_update_recipe_file"
create_html_page = "cmewpy.html_page.command_line:main_for_create_html_page"

[build-system]
requires = ["setuptools >= 80.0.0"]
build-backend = "setuptools.build_meta"

# Configure black.
[tool.black]
line-length = 79
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | build
    | dist
  )/
)
'''

# Configure pytest.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Ignore deprecation warnings from webob, esmpy and pkg_resources:
    "ignore:'cgi' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
    "ignore:Implicit None on return values is deprecated:DeprecationWarning",
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    # Ignore user warnings from pybtex:
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
